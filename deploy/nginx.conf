# web 服务的 Nginx 配置（由 Dockerfile.web 复制到 /etc/nginx/conf.d/default.conf）
# 静态文件：前端构建产物；/api/：转发给 api 服务。域名和 HTTPS 由前面自己的 Nginx / 负载均衡负责（D39），
# 也可以不加，直接用 http://服务器:端口 访问（此时 .env 里要设 COOKIE_SECURE=false）。

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

# 真实客户端 IP（登录、注册限流按 IP 计数）：只信任私有地址段（前面有自己的 Nginx / 负载均衡时）
# 发来的 X-Forwarded-For；从公网直接连进来的请求，它自带的 X-Forwarded-For 一律忽略，防止伪造 IP 绕过限流
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 前面的反向代理已经终止了 HTTPS 时，把 X-Forwarded-Proto 原样带给后端
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 略高于应用层的 200MB 上限，让超限时由后端返回清晰的中文错误提示（D26）
    client_max_body_size 210m;

    location /api/ {
        # 用变量 + Docker 内置 DNS：api 容器重启换了地址也能自动找到，不需要重启 web
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # 上传大文件（PDF 最大 200MB）：边收边转给后端，不在 Nginx 里整个缓存；超时放宽
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # 视频、音频用 Range 请求分段播放（iPad Safari 需要），Range 头和 206 响应默认原样透传
    }

    # 带哈希的构建产物：文件名变了内容才会变，可以缓存一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，发布新版本后刷新即可拿到新的资源文件名
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 较旧的 Nginx mime.types 里没有 webmanifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # 单页应用：没有对应文件的路径都回退到 index.html（由前端路由处理）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
